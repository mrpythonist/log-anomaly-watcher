services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: logwatcher
      POSTGRES_USER: logwatcher
      POSTGRES_PASSWORD: logwatcher
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logwatcher -d logwatcher"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://logwatcher:logwatcher@postgres:5432/logwatcher
      WINDOW_MINUTES: "10"
      BASELINE_HOURS: "1"
      SPIKE_MULTIPLIER: "3"
      SPIKE_MIN_COUNT: "5"
      NEW_SIGNATURE_LOOKBACK_HOURS: "24"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
