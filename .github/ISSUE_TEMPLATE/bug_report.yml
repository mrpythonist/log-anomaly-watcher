name: Bug report
description: Report a problem with Log Anomaly Watcher
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. A minimal reproduction is the fastest route to a fix. Do not paste secrets, tokens, passwords, or connection strings in this form.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: The spike detector did not flag...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact requests you sent and the responses you received.
      placeholder: |
        1. POST /api/logs with ...
        2. GET /api/anomalies returned ...
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or the output of git rev-parse HEAD.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of node --version.
      placeholder: v22.11.0
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Store in use
      options:
        - Memory (no DATABASE_URL)
        - Postgres (DATABASE_URL set)
        - Docker Compose
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration changed from defaults
      description: List any environment variables you changed (PORT, WINDOW_MINUTES, BASELINE_HOURS, SPIKE_MULTIPLIER, SPIKE_MIN_COUNT, NEW_SIGNATURE_LOOKBACK_HOURS). Do not paste DATABASE_URL or any password.
      placeholder: WINDOW_MINUTES=5
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help, such as log output or the dashboard state.
