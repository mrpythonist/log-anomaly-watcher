name: Feature request
description: Suggest an idea for Log Anomaly Watcher
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. The project is intentionally small, so explain the problem the feature solves and why it belongs in this service rather than in a separate tool.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where the current behaviour falls short.
      placeholder: I only want new-signature alerts for errors, not for info logs...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Include the API or configuration change if you have one in mind.
      placeholder: Add a NEW_SIGNATURE_LEVELS variable...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, including doing nothing or solving it outside this service.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else, such as similar behaviour in other tools.
